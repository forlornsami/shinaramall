<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- ── Primary SEO ─────────────────────────────────────────── -->
    <title>Shinara Mall - Online Shopping Pakistan</title>
    <meta name="description" content="Shop the best products at Shinara Mall. Wide selection of quality items with secure Pakistani payment methods including EasyPaisa, JazzCash, and cash on delivery." />
    <meta name="keywords" content="online shopping Pakistan, ecommerce Pakistan, EasyPaisa, JazzCash, HBL, cash on delivery, buy online Pakistan, Shinara Mall" />
    <meta name="author" content="Shinara Mall" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#2563EB" />
    <link rel="canonical" href="https://shinaramall.com/" />

    <!-- ── Favicons ──────────────────────────────────────────────── -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ── Open Graph (Facebook / WhatsApp / LinkedIn) ──────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shinaramall.com/" />
    <meta property="og:site_name" content="Shinara Mall" />
    <meta property="og:title" content="Shinara Mall - Online Shopping Pakistan" />
    <meta property="og:description" content="Shop the best products at Shinara Mall. Wide selection of quality items with secure Pakistani payment methods including EasyPaisa, JazzCash, and cash on delivery." />
    <meta property="og:image" content="https://shinaramall.com/apple-touch-icon.png" />
    <meta property="og:image:width" content="180" />
    <meta property="og:image:height" content="180" />
    <meta property="og:locale" content="en_PK" />

    <!-- ── Twitter Card ──────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@ShinaraMall" />
    <meta name="twitter:title" content="Shinara Mall - Online Shopping Pakistan" />
    <meta name="twitter:description" content="Shop the best products at Shinara Mall. Wide selection of quality items with secure Pakistani payment methods." />
    <meta name="twitter:image" content="https://shinaramall.com/apple-touch-icon.png" />

    <!-- ── Structured Data (JSON-LD) ─────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      "name": "Shinara Mall",
      "url": "https://shinaramall.com",
      "logo": "https://shinaramall.com/apple-touch-icon.png",
      "description": "Shop the best products at Shinara Mall. Wide selection of quality items with secure Pakistani payment methods.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "PK",
        "addressLocality": "Lahore"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "contact@shinaramall.com",
        "contactType": "customer service",
        "availableLanguage": ["English", "Urdu"]
      },
      "acceptsReservations": false,
      "paymentAccepted": "EasyPaisa, JazzCash, HBL Bank Transfer, Cash on Delivery",
      "currenciesAccepted": "PKR",
      "areaServed": "PK"
    }
    </script>

    <!-- ── Fonts ─────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
